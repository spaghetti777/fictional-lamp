<!DOCTYPE html>
<html>
<head>
    <title>Clicker</title>
</head>
<body>

    <h1 id="score">BIGBACK POINTS: 0</h1>

    <button onclick="addPoint()">CLICK ME</button>

    <script>
        let bigbackPoints = 0;

        function addPoint() {
            bigbackPoints = bigbackPoints + 1;
            document.getElementById("score").textContent =
                "BIGBACK POINTS: " + bigbackPoints;
        }
    </script>

</body>
</html>
