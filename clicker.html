<!DOCTYPE html>
<html>
<head>
    <title>Clicker</title>
</head>
<body>

    <h1 id="score">BIGBACK POINTS: 0</h1>

    <button onclick="addPoint()">CLICK ME</button>
 
    <script>
    let bigbackPoints = localStorage.getItem("bigbackPoints");

    if (bigbackPoints === null) {
        bigbackPoints = 0;
    } else {
        bigbackPoints = Number(bigbackPoints);
    }

    document.getElementById("score").textContent =
        "BIGBACK POINTS: " + bigbackPoints;

    function addPoint() {
        bigbackPoints = bigbackPoints + 1;

        localStorage.setItem("bigbackPoints", bigbackPoints);
        alert("Saved: " + localStorage.getItem("bigbackPoints"));

        document.getElementById("score").textContent =
            "BIGBACK POINTS: " + bigbackPoints;
    }
</script>

</body>
</html>
